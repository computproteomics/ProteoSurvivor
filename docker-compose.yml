services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata data/fixtures/initial_datasets.json &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: game_db
      DB_USER: game_user
      DB_PASSWORD: game_password
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Combined single-container service (frontend + backend in one image) ────
  # Use this target for ShinyProxy or any deployment that requires a single
  # container.  It bundles the React production build inside Django/gunicorn and
  # uses SQLite by default (no external database required).
  #
  # Build & run:
  #   docker compose up combined
  #   # or standalone:
  #   docker build -t proteosurvivor .
  #   docker run -p 8080:8080 proteosurvivor
  #
  # To use PostgreSQL instead of SQLite pass environment variables:
  #   DB_ENGINE=django.db.backends.postgresql
  #   DB_NAME / DB_USER / DB_PASSWORD / DB_HOST / DB_PORT
  combined:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.combined
      # Override SECRET_KEY in production.
      SECRET_KEY: change-me-in-production
      ALLOWED_HOSTS: "*"
    ports:
      - "8080:8080"

volumes:
  postgres_data:

